name: PUMA v1.3 Live Control
on:
  push:
    branches: [puma-v1.3-integration]
    paths:
      - .github/workflows/puma-v13-live-control.yml
      - puma_scouts/production.py
      - puma_scouts/validator.py
      - puma_scouts/variant_engine.py
      - puma_scouts/scouts/**
  workflow_dispatch:
jobs:
  live-control:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe Epicentr Samsung search price payload
        run: |
          python - <<'PY'
          import html,json,re,httpx
          from urllib.parse import quote_plus
          from puma_scouts.scouts.epicentr import _extract_embedded_price
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36','Accept-Language':'uk-UA,uk;q=0.9,ru;q=0.7,en;q=0.5'}
          queries=['Samsung Galaxy A55 5G 8 256GB','SM-A556B','SM-A556BLVCEUC']
          needles=['SM-A556BLVCEUC','SM-A556BZKCEUC','SM-A556BLBCEUC','SM-A556BZYCEUC','A55']
          for q in queries:
            for key in ('q','search'):
              u=f'https://epicentrk.ua/ua/search/?{key}={quote_plus(q)}'
              r=httpx.get(u,headers=h,follow_redirects=True,timeout=20); text=html.unescape(r.text).replace('\\/','/')
              hits=[]
              for needle in needles:
                for m in list(re.finditer(re.escape(needle),text,re.I))[:3]:
                  chunk=re.sub(r'\s+',' ',text[max(0,m.start()-700):m.end()+1200])
                  nums=[]
                  for pat in [r'"(?:price|productPrice|currentPrice|finalPrice|priceValue|salePrice|actualPrice)"\s*:\s*"?([0-9][0-9\s.,]{1,15})',r'([0-9][0-9\s]{3,10})\s*(?:₴|грн)']:
                    nums.extend(x.strip() for x in re.findall(pat,chunk,re.I))
                  hits.append({'needle':needle,'prices':nums[:12],'snippet':chunk[:1500]})
              print('EPICENTR_SEARCH_PRICE_DIAG='+json.dumps({'query':q,'key':key,'status':r.status_code,'bytes':len(text),'embedded_first':str(_extract_embedded_price(text)) if _extract_embedded_price(text) else None,'has_17999':('17999' in text or '17 999' in text),'hits':hits[:8]},ensure_ascii=False),flush=True)
          PY
      - name: Trace Xiaomi discovery and validation
        run: |
          python - <<'PY'
          import asyncio,json,time
          from puma_scouts.models import ProductMission
          from puma_scouts.production import scouts
          m=ProductMission(article='SUPPLIER-SKU-LOCK-ONLY',source_data={'name':'Монітор 27 2K Xiaomi Redmi A27Q 2025 100 Гц IPS HDR10 чорний','brand':'Xiaomi','model':'P27QCB-RA'})
          async def main():
            total=0
            for scout in scouts(['prom','epicentr','hotline','web_shops']):
              t=time.monotonic()
              try:
                report=await scout.scan(m);offers=[]
                for v in report.offers:
                  o=v.offer;offers.append({'verdict':v.verdict.value,'score':round(v.score,3),'price':float(o.price) if o.price is not None else None,'title':o.title,'url':str(o.url),'positive':v.positive_evidence,'conflicts':v.conflicts,'rejection':v.rejection_reasons})
                total+=len(offers);print('PUMA_TRACE_'+scout.marketplace.value.upper()+'='+json.dumps({'seconds':round(time.monotonic()-t,2),'health':report.health.value,'offers':offers},ensure_ascii=False),flush=True)
              except Exception as e:print('PUMA_TRACE_'+scout.marketplace.value.upper()+'='+json.dumps({'seconds':round(time.monotonic()-t,2),'error':type(e).__name__+': '+str(e)},ensure_ascii=False),flush=True)
            print('PUMA_TRACE_TOTAL_VALIDATED='+str(total))
          asyncio.run(main())
          PY
      - name: Control Xiaomi aggregate and Prom dedup
        run: |
          python - <<'PY'
          import asyncio,json,time
          from collections import Counter
          from puma_scouts.models import ProductMission
          from puma_scouts.production import scan
          m=ProductMission(article='SUPPLIER-SKU-LOCK-ONLY',source_data={'name':'Монітор 27 2K Xiaomi Redmi A27Q 2025 100 Гц IPS HDR10 чорний','brand':'Xiaomi','model':'P27QCB-RA'})
          t=time.monotonic();rows=asyncio.run(scan(m,['prom','epicentr','hotline','web_shops']));elapsed=round(time.monotonic()-t,2)
          groups=Counter((r['source'],r['price']) for r in rows);print('PUMA_LIVE_SECONDS='+str(elapsed));print('PUMA_LIVE_ROWS='+json.dumps(rows,ensure_ascii=False));print('PUMA_LIVE_PRICE_GROUPS='+json.dumps([{'source':s,'price':p,'cards':n} for (s,p),n in sorted(groups.items())],ensure_ascii=False));print('PUMA_LIVE_SOURCES='+','.join(sorted({r['source'] for r in rows})))
          wrong=[r for r in rows if any(x in r['found_title'].casefold() for x in ['x27gq','type-c 2026','120 гц','165 гц'])];print('PUMA_WRONG_VARIANTS='+json.dumps(wrong,ensure_ascii=False))
          if wrong:raise SystemExit('WRONG_VARIANTS_ACCEPTED')
          if any(n>1 for (s,p),n in groups.items() if s=='prom'):raise SystemExit('PROM_MIRROR_DUPLICATES_REMAIN')
          if not rows:raise SystemExit('NO_REAL_OFFERS_FOUND')
          PY
      - name: Multi-product live smoke
        if: success()
        run: |
          python - <<'PY'
          import asyncio,json,time
          from puma_scouts.models import ProductMission
          from puma_scouts.production import scan
          missions=[ProductMission(article='BATCH-1',source_data={'name':'Монітор Xiaomi Redmi A27Q 2025 27 2K 100 Гц','brand':'Xiaomi','model':'P27QCB-RA'}),ProductMission(article='BATCH-2',source_data={'name':'Apple AirPods Pro 2 USB-C','brand':'Apple','model':'MTJV3'}),ProductMission(article='BATCH-3',source_data={'name':'Samsung Galaxy A55 5G 8/256GB','brand':'Samsung','model':'SM-A556B'})]
          async def one(m):
            t=time.monotonic();rows=await scan(m,['prom','epicentr','hotline','web_shops']);return {'article':m.article,'name':m.source_data['name'],'seconds':round(time.monotonic()-t,2),'offers':len(rows),'sources':sorted({r['source'] for r in rows}),'rows':[{'source':r['source'],'price':r['price'],'title':r['found_title'],'url':r['url'],'match':r['match']} for r in rows]}
          async def main():return await asyncio.gather(*[one(m) for m in missions])
          started=time.monotonic();result=asyncio.run(main());print('PUMA_BATCH_SECONDS='+str(round(time.monotonic()-started,2)));print('PUMA_BATCH_RESULTS='+json.dumps(result,ensure_ascii=False))
          if not result[0]['offers']:raise SystemExit('CONTROL_PRODUCT_LOST_IN_BATCH')
          if sum(x['offers'] for x in result)<2:raise SystemExit('BATCH_DISCOVERY_TOO_WEAK')
          PY
