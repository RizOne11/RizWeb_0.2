name: PUMA 15 Active Job Probe
on:
  push:
    branches: [puma-15-rerun-compare]
    paths:
      - '.github/workflows/puma-15-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print active 15-product job status
        run: |
          set -euo pipefail
          curl -fsS 'https://rizweb-0-2.onrender.com/api/jobs/1e49b597ea07'
