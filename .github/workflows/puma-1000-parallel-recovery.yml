name: PUMA 1000 Parallel Performance Recovery

on:
  push:
    branches: [puma-performance-recovery]
    paths:
      - '.github/workflows/puma-1000-parallel-recovery.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      PUMA_SOURCE_WALL_TIMEOUT: "70"
      PUMA_SOURCE_HARD_TIMEOUT: "140"
      PUMA_PRODUCT_CONCURRENCY: "4"
      PUMA_RUNTIME_CACHE_ENABLED: "1"
      PUMA_RUNTIME_CACHE_PATH: "/tmp/puma-1000-recovery-cache.sqlite"
      PUMA_SERPER_CACHE_SECONDS: "2592000"
      PUMA_IDENTITY_CACHE_SECONDS: "2592000"
      PUMA_REFRESH_URL_LIMIT: "1"
      PUMA_REFRESH_WEB_URL_LIMIT: "3"
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: puma-performance-recovery

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify isolated benchmark input and Serper
        run: |
          set -euo pipefail
          if [ -z "${SERPER_API_KEY:-}" ]; then
            echo "SERPER_REQUIRED_BUT_NOT_CONFIGURED"
            exit 42
          fi
          rm -f /tmp/puma-1000-recovery-cache.sqlite*
          python - <<'PY'
          from puma_scouts.production import read_missions
          path="benchmarks/PUMA_random_1000_compact_20260919.csv"
          missions=read_missions(path, limit=1000)
          assert len(missions)==1000, len(missions)
          assert len({m.article for m in missions})==1000, "duplicate mission articles"
          print("PUMA1000_INPUT_PRODUCTS=1000", flush=True)
          print("PUMA1000_SERPER_CONFIGURED=1", flush=True)
          print("PUMA1000_FIRST_ARTICLE="+missions[0].article, flush=True)
          print("PUMA1000_LAST_ARTICLE="+missions[-1].article, flush=True)
          PY

      - name: Discovery then strict Fast Refresh on identical 1000 SKUs
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from puma_scouts.production import run_sync, PRODUCT_CONCURRENCY

          input_path="benchmarks/PUMA_random_1000_compact_20260919.csv"
          selected=["prom","epicentr","hotline","web_shops"]

          def run_pass(label, refresh_only, report_path, classic_path, summary_path):
              if refresh_only:
                  os.environ["PUMA_REFRESH_ONLY"]="1"
              else:
                  os.environ.pop("PUMA_REFRESH_ONLY", None)

              started=time.monotonic()
              summary=run_sync(
                  input_path,
                  report_path,
                  limit=1000,
                  selected=selected,
                  classic_output_path=classic_path,
                  supplier="parallel-1000-recovery",
              )
              elapsed=round(time.monotonic()-started,2)
              summary["wall_seconds"]=elapsed
              summary["pass_label"]=label
              summary["product_concurrency_runtime"]=PRODUCT_CONCURRENCY
              Path(summary_path).write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

              repair_total=sum(
                  int((bucket or {}).get("repair_required_products") or 0)
                  for bucket in (summary.get("source_discovery") or {}).values()
              )
              print(f"PUMA1000_{label}_SECONDS={elapsed}", flush=True)
              print(f"PUMA1000_{label}_FOUND={summary.get('found_products')}/1000", flush=True)
              print(f"PUMA1000_{label}_OFFERS={summary.get('offers')}", flush=True)
              print(f"PUMA1000_{label}_CONFIRMED={summary.get('confirmed')}", flush=True)
              print(f"PUMA1000_{label}_PROBABLE={summary.get('probable')}", flush=True)
              print(f"PUMA1000_{label}_SERPER_REQUESTS={summary.get('serper_api_requests')}", flush=True)
              print(f"PUMA1000_{label}_SERPER_CACHE_HITS={summary.get('serper_cache_hits')}", flush=True)
              print(f"PUMA1000_{label}_REPAIR_QUEUE={repair_total}", flush=True)
              print(
                  f"PUMA1000_{label}_COVERAGE="
                  + json.dumps(summary.get("coverage_by_source",{}), ensure_ascii=False),
                  flush=True,
              )
              print(
                  f"PUMA1000_{label}_SOURCE_COUNTS="
                  + json.dumps(summary.get("source_count_distribution",{}), ensure_ascii=False),
                  flush=True,
              )
              return summary

          discovery=run_pass(
              "DISCOVERY",
              False,
              "/tmp/PUMA_1000_recovery_discovery.xlsx",
              "/tmp/PUMA_1000_recovery_discovery_classic.xlsx",
              "/tmp/puma-1000-discovery-summary.json",
          )

          refresh=run_pass(
              "REFRESH",
              True,
              "/tmp/PUMA_1000_recovery_refresh.xlsx",
              "/tmp/PUMA_1000_recovery_refresh_classic.xlsx",
              "/tmp/puma-1000-refresh-summary.json",
          )

          discovery_seconds=float(discovery.get("wall_seconds") or 0)
          refresh_seconds=float(refresh.get("wall_seconds") or 0)
          repair_total=sum(
              int((bucket or {}).get("repair_required_products") or 0)
              for bucket in (refresh.get("source_discovery") or {}).values()
          )
          comparison={
              "products":1000,
              "discovery_seconds":discovery_seconds,
              "refresh_seconds":refresh_seconds,
              "speedup":round(discovery_seconds/max(0.01,refresh_seconds),2),
              "discovery_found":discovery.get("found_products"),
              "refresh_found":refresh.get("found_products"),
              "found_delta":int(refresh.get("found_products") or 0)-int(discovery.get("found_products") or 0),
              "discovery_offers":discovery.get("offers"),
              "refresh_offers":refresh.get("offers"),
              "discovery_serper_requests":discovery.get("serper_api_requests"),
              "refresh_serper_requests":refresh.get("serper_api_requests"),
              "refresh_serper_cache_hits":refresh.get("serper_cache_hits"),
              "repair_queue":repair_total,
              "product_concurrency":PRODUCT_CONCURRENCY,
          }
          Path("/tmp/puma-1000-comparison.json").write_text(
              json.dumps(comparison, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("PUMA1000_SPEEDUP="+str(comparison["speedup"]), flush=True)
          print("PUMA1000_REPAIR_QUEUE="+str(repair_total), flush=True)
          print("PUMA1000_COMPARISON="+json.dumps(comparison, ensure_ascii=False), flush=True)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puma-1000-performance-recovery-${{ github.run_id }}
          retention-days: 7
          path: |
            /tmp/puma-1000-discovery-summary.json
            /tmp/puma-1000-refresh-summary.json
            /tmp/puma-1000-comparison.json
            /tmp/PUMA_1000_recovery_discovery.xlsx
            /tmp/PUMA_1000_recovery_discovery_classic.xlsx
            /tmp/PUMA_1000_recovery_refresh.xlsx
            /tmp/PUMA_1000_recovery_refresh_classic.xlsx
          if-no-files-found: warn
