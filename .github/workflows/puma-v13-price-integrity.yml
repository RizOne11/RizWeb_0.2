name: PUMA v1.3 Price Integrity

on:
  push:
    branches: [puma-v1.3-integration]
  workflow_dispatch:

jobs:
  price-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Price integrity regression gate
        run: PYTHONPATH=. pytest -q tests/test_v13_price_integrity.py
