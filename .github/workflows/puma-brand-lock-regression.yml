name: PUMA Brand Lock Regression

on:
  push:
    branches: [puma-brand-lock-batch]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Real-world false-positive regressions
        run: pytest -q tests/test_real_world_false_positive_lock.py
      - name: Full suite
        run: pytest -q tests
