name: PUMA Gold Regression

on:
  push:
    branches: [main, puma-gold-regression]

jobs:
  gold-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Gold regressions
        run: pytest -q tests/test_gold_identity_regressions.py
      - name: Full regression suite
        run: pytest -q tests
