name: PUMA Gold Live Canary

on:
  push:
    branches: [puma-gold-regression]
    paths:
      - '.github/workflows/puma-gold-live-canary.yml'

jobs:
  short-sku-live-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      PUMA_SOURCE_WALL_TIMEOUT: '70'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scan known article-free Discovery regressions
        shell: bash
        run: |
          python - <<'PY'
          import asyncio, json, time
          from puma_scouts.models import ProductMission
          from puma_scouts.production import scan
          from puma_scouts.scouts.catalog import PromScout

          missions = [
              ProductMission(article='35-005', source_data={'name':'Бокорезы Polax 180 мм (35-005)','brand':'Polax'}),
              ProductMission(article='01-0177', source_data={'name':'Ящик для инструмента Polax 19" (01-0177)','brand':'Polax'}),
              ProductMission(article='36-031', source_data={'name':'Молоток слесарный Polax 1000 г (36-031)','brand':'Polax'}),
          ]

          async def one(mission):
              queries = await PromScout(timeout=10).generate_queries(mission)
              started = time.monotonic()
              rows = await scan(mission, ['prom','epicentr','hotline','web_shops'])
              return {
                  'article': mission.article,
                  'queries': queries,
                  'seconds': round(time.monotonic()-started, 2),
                  'offers': len(rows),
                  'sources': sorted({r['source'] for r in rows}),
                  'rows': [
                      {
                          'source': r['source'],
                          'price': r.get('price'),
                          'currency': r.get('currency'),
                          'title': r.get('found_title'),
                          'url': r.get('url'),
                          'match': r.get('match'),
                      }
                      for r in rows
                  ],
              }

          async def main():
              return await asyncio.gather(*(one(m) for m in missions))

          result = asyncio.run(main())
          print('PUMA_ARTICLE_FREE_CANARY='+json.dumps(result, ensure_ascii=False), flush=True)
          by_article = {item['article']: item for item in result}

          for item in result:
              article = item['article'].casefold()
              if not item['queries']:
                  raise SystemExit('ZERO_QUERIES:'+item['article'])
              for query in item['queries']:
                  if article in query.casefold():
                      raise SystemExit(f'ARTICLE_LEAK_IN_DISCOVERY:{item["article"]}:{query}')

          # Known positive canaries. They are intentionally discovered without
          # using supplier article as a search key.
          if by_article['35-005']['offers'] < 1:
              raise SystemExit('LIVE_FALSE_NEGATIVE:35-005')
          if by_article['01-0177']['offers'] < 1:
              raise SystemExit('LIVE_FALSE_NEGATIVE:01-0177')

          forbidden = {
              '35-005': ('335-005',),
              '01-0177': ('01-015', '01-0144'),
          }
          for article, needles in forbidden.items():
              for row in by_article[article]['rows']:
                  haystack = ((row.get('title') or '') + ' ' + (row.get('url') or '')).casefold()
                  for needle in needles:
                      if needle.casefold() in haystack:
                          raise SystemExit(f'LIVE_CONTAMINATION:{article}:{needle}')

          for row in by_article['01-0177']['rows']:
              title = (row.get('title') or '').casefold()
              if '13 дюйм' in title or '13 inch' in title or '13"' in title:
                  raise SystemExit('LIVE_SIZE_CONTAMINATION:01-0177:13in')
          PY
