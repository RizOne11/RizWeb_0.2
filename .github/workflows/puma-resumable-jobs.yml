name: PUMA Resumable Jobs Regression

on:
  push:
    branches: [puma-resumable-jobs]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_resumable_jobs.py
      - run: pytest -q tests
