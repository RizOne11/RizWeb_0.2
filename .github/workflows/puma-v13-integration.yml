name: PUMA v1.3 Integration
on:
  push:
    branches: [puma-v1.3-integration]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - name: Import production web app
        run: python -c "import app; from puma_scouts.production import read_missions, save, run_sync; print('PUMA_V13_IMPORT_OK')"
      - name: Generic product identity regressions
        run: |
          python - <<'PY'
          from puma_scouts.variant_engine import entity_type, variant_conflicts
          from puma_scouts.validator import _brand_conflict
          def clean(src,off):
              c=variant_conflicts(src,off); assert not c,(src,off,c)
          def conflict(src,off,needle):
              c=variant_conflicts(src,off); assert any(needle in x for x in c),(src,off,c)
          assert entity_type('Монітор Redmi G34WQ з вигнутим екраном 180 Гц')=='monitor'
          conflict('Samsung Galaxy A55 5G 8/256GB','Дисплей модуль для Samsung Galaxy A55','whole-product mismatch')
          conflict('Samsung Galaxy A55 5G 8/256GB','Акумулятор для Samsung Galaxy A55','whole-product mismatch')
          conflict('Samsung Galaxy A55 5G 8/256GB','Samsung Galaxy A17 8/256GB','product family mismatch')
          clean('Samsung Galaxy A55 5G 8/256GB','Samsung Galaxy A55 5G 8/256GB Light Violet')
          clean('Samsung Galaxy A55 5G 8/256GB','Samsung Galaxy A55 5G 8/256GB Black')
          conflict('Apple AirPods Pro 2 USB-C','Apple AirPods Pro 3 USB-C','generation mismatch')
          conflict('Apple AirPods Pro 2 USB-C','Лівий навушник AirPods Pro 2 USB-C','whole-product mismatch')
          clean('Apple AirPods Pro 2 USB-C','Apple AirPods Pro 2 USB-C MTJV3')
          assert _brand_conflict('Apple','Logitech Навушники-вкладиші Apple AirPods Pro 2 gen MagSafe USB-C білі')
          assert not _brand_conflict('Apple','Навушники Apple AirPods Pro 2 USB-C MTJV3')
          assert not _brand_conflict('Apple','Apple AirPods Pro 2 USB-C MTJV3')
          clean('Монітор Xiaomi Redmi A27Q 2025 27 2K 100 Гц','Монітор Xiaomi Redmi A27Q 27 2K IPS 100 Гц')
          conflict('Монітор Xiaomi Redmi A27Q 2025 27 2K 100 Гц','Монітор Xiaomi Redmi X27GQ 27 2K 180 Гц','product family mismatch')
          clean('SSD Kingston NV2 1TB','SSD Kingston NV2 1TB M.2 NVMe')
          conflict('SSD Kingston NV2 1TB','SSD Kingston NV2 2TB M.2 NVMe','storage mismatch')
          clean('Кросівки Nike Air Max 270 розмір 42','Кросівки Nike Air Max 270 Black розмір 42')
          conflict('Кросівки Nike Air Max 270 розмір 42','Кросівки Nike Air Max 270 White розмір 43','size/volume mismatch')
          clean('Парфуми Dior Sauvage 100 ml','Dior Sauvage Eau de Parfum 100 ml')
          conflict('Парфуми Dior Sauvage 100 ml','Dior Sauvage Eau de Parfum 60 ml','size/volume mismatch')
          clean('Шина Michelin Primacy 4 205/55 R16','Michelin Primacy 4 205/55 R16 91V')
          conflict('Шина Michelin Primacy 4 205/55 R16','Michelin Primacy 4 225/45 R17 91W','size/volume mismatch')
          clean('Телевізор Samsung QN90D 55','Samsung Neo QLED QN90D 55')
          conflict('Телевізор Samsung QN90D 55','Samsung Neo QLED QN90D 65','size/volume mismatch')
          print('PUMA_GENERIC_IDENTITY_REGRESSIONS_OK')
          PY
      - name: Contamination regression gate
        run: PYTHONPATH=. pytest -q tests/test_v13_contamination.py
      - name: XLSX reader and report smoke
        run: |
          python - <<'PY'
          from openpyxl import Workbook, load_workbook
          from puma_scouts.production import read_missions, save
          wb=Workbook(); ws=wb.active; ws.append(['Артикул','Назва','Бренд','Модель']); ws.append(['SUP-001','Монітор 27 2K Xiaomi Redmi A27Q 2025','Xiaomi','P27QCB-RA']); wb.save('/tmp/in.xlsx')
          m=read_missions('/tmp/in.xlsx'); assert len(m)==1 and m[0].article=='SUP-001'
          save([{'article':'SUP-001','name':m[0].source_data['name'],'brand':'Xiaomi','model':'P27QCB-RA','source':'prom','price':9998.0,'currency':'UAH','availability':'','found_title':'Xiaomi Redmi A27Q','url':'https://prom.ua/p/test','match':.88,'domain':'prom.ua','health':'FOUND'}],'/tmp/out.xlsx')
          out=load_workbook('/tmp/out.xlsx',data_only=True); assert {'Offers','Price summary'} <= set(out.sheetnames); assert out['Price summary']['E2'].value==1
          print('PUMA_V13_XLSX_OK')
          PY
