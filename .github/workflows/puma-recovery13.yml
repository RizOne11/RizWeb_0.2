name: PUMA Recovery 13 Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [puma-performance-recovery, puma-homoglyph-hardening]
    paths:
      - 'benchmarks/.trigger-puma-recovery13'
      - '.github/workflows/puma-recovery13.yml'

concurrency:
  group: puma-recovery13-quality
  cancel-in-progress: false

jobs:
  recovery13:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      PUMA_SOURCE_WALL_TIMEOUT: "70"
      PUMA_SOURCE_HARD_TIMEOUT: "140"
      PUMA_PRODUCT_CONCURRENCY: "4"
      PUMA_RUNTIME_CACHE_ENABLED: "1"
      PUMA_RUNTIME_CACHE_PATH: "/tmp/puma-recovery13.sqlite"
      PUMA_SERPER_CACHE_SECONDS: "2592000"
      PUMA_IDENTITY_CACHE_SECONDS: "2592000"
      PUMA_REFRESH_URL_LIMIT: "3"
      PUMA_REFRESH_WEB_URL_LIMIT: "3"
      PUMA_REPAIR_QUERY_LIMIT: "1"
      PUMA_IDENTITY_SAVE_PROBABLE: "1"
      PUMA_REFRESH_REPAIR_ENABLED: "1"
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Discovery then repaired refresh on 13 targeted SKUs
        run: |
          set -euo pipefail
          test -n "${SERPER_API_KEY:-}"
          rm -f /tmp/puma-recovery13.sqlite*
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from puma_scouts.production import run_sync

          inp="benchmarks/PUMA_recovery13_20260919.csv"
          sources=["prom","epicentr","hotline","web_shops"]

          def run_pass(label, refresh):
              if refresh:
                  os.environ["PUMA_REFRESH_ONLY"]="1"
              else:
                  os.environ.pop("PUMA_REFRESH_ONLY",None)
              started=time.monotonic()
              summary=run_sync(
                  inp,
                  f"/tmp/{label.lower()}13.xlsx",
                  limit=13,
                  selected=sources,
                  classic_output_path=f"/tmp/{label.lower()}13_classic.xlsx",
                  supplier="recovery13",
              )
              summary["wall_seconds"]=round(time.monotonic()-started,2)
              Path(f"/tmp/{label.lower()}13.json").write_text(
                  json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8"
              )
              print(f"PUMA13_{label}_FOUND={summary.get('found_products')}/13",flush=True)
              print(f"PUMA13_{label}_OFFERS={summary.get('offers')}",flush=True)
              print(f"PUMA13_{label}_SECONDS={summary.get('wall_seconds')}",flush=True)
              print(f"PUMA13_{label}_SERPER={summary.get('serper_api_requests')}",flush=True)
              print(f"PUMA13_{label}_COVERAGE="+json.dumps(summary.get("coverage_by_source",{}),ensure_ascii=False),flush=True)
              return summary

          d=run_pass("DISCOVERY",False)
          r=run_pass("REFRESH",True)

          false_positive_skus={"49_xl","2000000002279"}
          dmap={p["article"]:p for p in d["product_results"]}
          rmap={p["article"]:p for p in r["product_results"]}
          fp={
              sku:{
                  "discovery_status":dmap[sku]["status"],
                  "refresh_status":rmap[sku]["status"],
                  "discovery_offers":dmap[sku]["offers"],
                  "refresh_offers":rmap[sku]["offers"],
              }
              for sku in false_positive_skus
          }
          source_gaps=[]
          for sku,p in dmap.items():
              if sku in false_positive_skus:
                  continue
              ds={o["source"] for o in p.get("offers_detail",[])}
              rs={o["source"] for o in rmap[sku].get("offers_detail",[])}
              if ds-rs:
                  source_gaps.append({"article":sku,"missing":sorted(ds-rs)})

          comparison={
              "discovery_found":d.get("found_products"),
              "refresh_found":r.get("found_products"),
              "discovery_offers":d.get("offers"),
              "refresh_offers":r.get("offers"),
              "discovery_seconds":d.get("wall_seconds"),
              "refresh_seconds":r.get("wall_seconds"),
              "discovery_serper":d.get("serper_api_requests"),
              "refresh_serper":r.get("serper_api_requests"),
              "repair_attempted":r.get("repair_products_attempted"),
              "repair_rescued":r.get("repair_products_rescued"),
              "false_positive_skus":fp,
              "remaining_source_gaps":source_gaps,
              "discovery_coverage":d.get("coverage_by_source"),
              "refresh_coverage":r.get("coverage_by_source"),
          }
          Path("/tmp/comparison13.json").write_text(
              json.dumps(comparison,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print("PUMA13_COMPARISON="+json.dumps(comparison,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puma-recovery13-${{ github.run_id }}
          retention-days: 7
          path: |
            /tmp/discovery13.json
            /tmp/refresh13.json
            /tmp/comparison13.json
            /tmp/discovery13.xlsx
            /tmp/refresh13.xlsx
          if-no-files-found: warn
