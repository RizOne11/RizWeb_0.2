name: PUMA Probe Job 8ff9a699e724

on:
  push:
    branches: [puma-performance-recovery]
    paths:
      - '.github/workflows/puma-job-probe-8ff9a699e724.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe uploaded 1000-SKU job
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url="https://rizweb-0-2.onrender.com/api/jobs/8ff9a699e724"
          with urllib.request.urlopen(url, timeout=90) as r:
              data=json.load(r)
          keep={k:data.get(k) for k in (
              "id","status","current","total","percent","message","filename",
              "supplier","marketplaces","limit","engine_build","current_engine_build",
              "stale_build","resume_count","resume_available","created_at","started_at","finished_at"
          )}
          summary=data.get("summary") or {}
          keep["summary_products"]=summary.get("products")
          keep["summary_found_products"]=summary.get("found_products")
          keep["summary_offers"]=summary.get("offers")
          keep["product_results_count"]=len(summary.get("product_results") or [])
          print("PUMA_JOB_PROBE="+json.dumps(keep,ensure_ascii=False),flush=True)
          PY
