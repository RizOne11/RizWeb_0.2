name: PUMA durable live test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/puma-durable-live-test.yml'

jobs:
  durable-live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Render auto-deploy to settle
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rizweb-0-2.onrender.com'
          sleep 60
          ok=0
          for i in $(seq 1 30); do
            body="$(curl -fsS "$BASE/api/storage" || true)"
            echo "storage=$body"
            if python -c 'import json,sys; d=json.loads(sys.argv[1]); raise SystemExit(0 if d.get("mode")=="s3" and d.get("durable") is True else 1)' "$body" 2>/dev/null; then
              ok=$((ok+1))
              if [ "$ok" -ge 3 ]; then exit 0; fi
            else
              ok=0
            fi
            sleep 5
          done
          echo 'Timed out waiting for stable durable live service' >&2
          exit 1

      - name: Create real live job and download reports
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rizweb-0-2.onrender.com'
          printf '%s\n' \
            'Код товара;Категория;Артикул;Название;Цена;Старая цена;Наличие;Производитель' \
            '002288;Мониторы;P27QCB-RA;Монитор Xiaomi Redmi A27Q 2025;9000;;1;Xiaomi' > catalog.csv

          curl -fsS -D headers.txt -o /dev/null \
            -F 'catalog=@catalog.csv;type=text/csv' \
            -F 'supplier=PUMA durability canary' \
            -F 'limit=1' \
            -F 'marketplaces=prom' \
            -F 'marketplaces=epicentr' \
            -F 'marketplaces=hotline' \
            -F 'marketplaces=web_shops' \
            "$BASE/analyze"

          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' headers.txt | tail -1)"
          jid="$(printf '%s' "$location" | sed -E 's#^.*/jobs/([0-9a-f]+).*#\1#')"
          test -n "$jid"
          echo "PUMA_DURABLE_JOB_ID=$jid"

          status=''
          for i in $(seq 1 120); do
            curl -fsS "$BASE/api/jobs/$jid" -o status.json
            status="$(python -c 'import json; print(json.load(open("status.json",encoding="utf-8")).get("status",""))')"
            echo "job=$jid status=$status"
            if [ "$status" = done ]; then break; fi
            if [ "$status" = error ] || [ "$status" = interrupted ]; then cat status.json; exit 1; fi
            sleep 5
          done
          test "$status" = done

          curl -fsS "$BASE/jobs/$jid/xlsx" -o market.xlsx
          curl -fsS "$BASE/jobs/$jid/classic-xlsx" -o classic.xlsx
          test -s market.xlsx
          test -s classic.xlsx
          echo "MARKET_XLSX_BYTES=$(stat -c%s market.xlsx)"
          echo "CLASSIC_XLSX_BYTES=$(stat -c%s classic.xlsx)"
          sha256sum market.xlsx classic.xlsx
