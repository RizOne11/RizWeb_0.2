name: PUMA Quality Round2

on:
  push:
    branches: [puma-quality-round2]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Round2 regressions
        run: pytest -q tests/test_quality_round2.py
      - name: Full suite
        run: pytest -q tests
