name: PUMA XON Confirmation

on:
  push:
    branches: [puma-xon-confirmation]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: XON model confirmation regression
        run: pytest -q tests/test_model_lock.py
      - name: Full suite
        run: pytest -q tests
