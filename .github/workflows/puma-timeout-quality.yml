name: PUMA Timeout Quality

on:
  push:
    branches: [puma-timeout-quality]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - name: Timeout regression
        run: pytest -q tests/test_timeout_quality.py
      - name: Full suite
        run: pytest -q tests
