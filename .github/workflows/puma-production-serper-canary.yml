name: PUMA Production Serper Canary

on:
  push:
    branches: [puma-gold-regression]
    paths:
      - '.github/workflows/puma-production-serper-canary.yml'

jobs:
  production-serper-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Run live 3-product article-free canary
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rizweb-0-2.onrender.com'

          printf '%s\n' \
            'Артикул;Название;Цена;Производитель' \
            '35-005;Бокорезы Polax 180 мм (35-005);250;Polax' \
            '01-0177;Ящик для инструмента Polax 19" (01-0177);850;Polax' \
            '36-031;Молоток слесарный Polax 1000 г (36-031);500;Polax' > catalog.csv

          curl -fsS -D headers.txt -o /dev/null \
            -F 'catalog=@catalog.csv;type=text/csv' \
            -F 'supplier=PUMA production serper canary' \
            -F 'limit=3' \
            -F 'marketplaces=prom' \
            -F 'marketplaces=epicentr' \
            -F 'marketplaces=hotline' \
            -F 'marketplaces=web_shops' \
            "$BASE/analyze"

          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' headers.txt | tail -1)"
          jid="$(printf '%s' "$location" | sed -E 's#^.*/jobs/([0-9a-f]+).*#\1#')"
          test -n "$jid"
          echo "PUMA_SERPER_CANARY_JOB_ID=$jid"

          status=''
          for i in $(seq 1 120); do
            curl -fsS "$BASE/api/jobs/$jid" -o status.json
            status="$(python -c 'import json; print(json.load(open("status.json",encoding="utf-8")).get("status",""))')"
            echo "job=$jid status=$status"
            if [ "$status" = done ]; then break; fi
            if [ "$status" = error ] || [ "$status" = interrupted ]; then cat status.json; exit 1; fi
            sleep 5
          done
          test "$status" = done

          echo 'PUMA_STATUS_JSON_BEGIN'
          cat status.json
          echo
          echo 'PUMA_STATUS_JSON_END'

          curl -fsS "$BASE/jobs/$jid/xlsx" -o market.xlsx
          test -s market.xlsx

          python - <<'PY'
          import json
          from openpyxl import load_workbook

          wb = load_workbook('market.xlsx', data_only=True, read_only=True)
          print('PUMA_SHEETS='+json.dumps(wb.sheetnames, ensure_ascii=False))

          for ws in wb.worksheets:
              print('PUMA_SHEET='+ws.title)
              rows = list(ws.iter_rows(values_only=True))
              for row in rows[:50]:
                  print('PUMA_XLSX_ROW='+json.dumps(list(row), ensure_ascii=False, default=str))
          PY
