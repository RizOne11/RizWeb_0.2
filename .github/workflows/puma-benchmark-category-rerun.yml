name: PUMA Benchmark 100 Category Restart

on:
  push:
    branches: [puma-benchmark-category-rerun]
    paths:
      - '.github/workflows/puma-benchmark-category-rerun.yml'

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart exact benchmark-100
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://rizweb-0-2.onrender.com/api/jobs/8fd23d835495/rerun?limit=100'
# restart-after-instance-reboot
