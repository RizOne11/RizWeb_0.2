<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PUMA Platform {{app_version}} — аналіз</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="wrap"><section class="card job">
<div class="badge">доПУМАгатель • {{app_version}} • PRODUCTION CORE</div>
<h1 id="headline">PUMA аналізує ринок 🐆</h1><p id="message">Готуємо задачу…</p>
<div class="bar"><div id="bar"></div></div><div class="progress-row"><b id="pct">0%</b><span id="counter">0 / 0</span></div><p class="muted" id="product"></p>
<div id="done" class="done hidden"><div id="summary" class="summary"></div><div id="confidence" class="cost-box"></div><div class="actions"><a id="xlsx" class="primary link">⬇ Завантажити Excel-звіт</a><a class="secondary link" href="/analysis">Новий аналіз</a><a class="secondary link" href="/">PUMA Platform</a></div></div>
<div id="error" class="error hidden"></div><footer class="brand-footer">{{brand_line}} • PUMA Platform {{app_version}}</footer>
</section></main>
<script>
const id="{{job_id}}";
function fmtTime(sec){sec=Number(sec||0);if(sec<60)return `${sec.toFixed(1)} с`;return `${Math.floor(sec/60)} хв ${Math.round(sec%60)} с`}
async function tick(){
 try{
  const r=await fetch(`/api/jobs/${id}`,{cache:'no-store'});if(!r.ok){setTimeout(tick,1800);return}
  const j=await r.json(),p=Number(j.percent||0);
  document.getElementById('message').textContent=j.message||'';document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%';document.getElementById('counter').textContent=`${j.current||0} / ${j.total||0}`;document.getElementById('product').textContent=j.current_product||'';
  if(j.status==='done'){
   const s=j.summary||{};document.getElementById('headline').textContent='Готово 😎';
   document.getElementById('summary').innerHTML=`<b>PUMA завершила аналіз.</b> ${s.products||0} товарів • ${s.offers||0} валідних пропозицій • знайдено <b>${s.found_products||0}/${s.products||0}</b> (${s.found_pct||0}%) • ${s.sources||0} джерел${s.elapsed_seconds!=null?' • '+fmtTime(s.elapsed_seconds):''}.`;
   document.getElementById('confidence').innerHTML=`<b>Identity Confidence</b><div class="muted">CONFIRMED: <b>${s.confirmed||0}</b> • PROBABLE: <b>${s.probable||0}</b>. AMBIGUOUS та CONFLICT не включені в ринкову ціну.</div>`;
   document.getElementById('xlsx').href=j.xlsx_url;document.getElementById('done').classList.remove('hidden');return;
  }
  if(['error','interrupted'].includes(j.status)){const e=document.getElementById('error');e.textContent=(j.status==='interrupted'?'Процес перервався: ':'Помилка: ')+(j.message||'');e.classList.remove('hidden');return}
 }catch(e){}
 setTimeout(tick,1500)
}
tick();
</script></body></html>
