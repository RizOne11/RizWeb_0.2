services:
  - type: web
    name: priceintel
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: MAX_PRODUCTS_PER_JOB
        value: "5000"
      - key: MAX_UPLOAD_MB
        value: "120"
      - key: PUMA_REQUIRE_AUTH
        value: "1"
      - key: PUMA_AUTH_USER
        value: "puma"
      - key: PUMA_AUTH_TOKEN
        sync: false
      - key: PUMA_MAX_ACTIVE_JOBS
        value: "1"
      - key: PUMA_MAX_OUTSTANDING_JOBS
        value: "6"
      - key: PUMA_JOB_STARTS_PER_MINUTE
        value: "10"
